<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>준비 중</title>
<style>
  body { margin: 0; font-family: system-ui, "Malgun Gothic", sans-serif; color: #1f2937; background: #fff; }
  main { max-width: 560px; margin: 72px auto; padding: 0 16px; text-align: center; }
  .id { display: inline-block; font-size: 12px; color: #6b7280; border: 1px solid #e5e7eb; border-radius: 999px; padding: 3px 10px; }
  h1 { font-size: 24px; margin: 14px 0 8px; }
  p { color: #6b7280; font-size: 15px; line-height: 1.6; margin: 0; }
</style>
</head>
<body>
<header data-hotel-header></header>
<main>
  <span class="id" id="screenId"></span>
  <h1 id="title">준비 중인 화면</h1>
  <p>이 화면은 아직 만드는 중입니다.<br>위 메뉴로 다른 화면에 갈 수 있습니다.</p>
</main>
<script>
  // 주소 → 화면 이름. 관리자 화면은 상단 메뉴가 관리자만 들어오게 막는다.
  const SCREENS = {
    "/admin/rooms/page":        { id: "ADM-001", title: "객실 관리", admin: true },
    "/admin/closed-dates/page": { id: "ADM-002", title: "예약 일자 관리", admin: true },
    "/admin/reservations/page": { id: "ADM-003", title: "예약 관리", admin: true },
    "/rooms/page":              { id: "ROOM-001", title: "객실 추천", admin: false },
    "/reservations/page":       { id: "RSV", title: "내 예약", admin: false },
  };
  const screen = SCREENS[location.pathname];
  if (screen) {
    document.title = `${screen.title} (준비 중)`;
    title.textContent = screen.title;
    screenId.textContent = screen.id;
    if (screen.admin) document.querySelector("[data-hotel-header]").dataset.hotelHeader = "admin";
  }
</script>
<script src="/layout/layout.js"></script>
</body>
</html>
