<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상단 메뉴 미리보기</title>
<style>
  body { margin: 0; background: #f3f4f6; font-family: system-ui, "Malgun Gothic", sans-serif; color: #1f2937; }
  .pick { margin: 24px 24px 0; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pick a { padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 999px; color: #1f2937; text-decoration: none; background: #fff; }
  .pick a.on { background: #1f2937; color: #fff; border-color: #1f2937; }
  section { margin: 16px 24px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
  .body { padding: 28px; color: #9ca3af; font-size: 14px; }
</style>
<script>
  // 미리보기 전용: 로그인 API가 아직 없어서 /members/me 응답을 흉내 낸다. 실제 화면에는 넣지 않는다.
  const AS = new URLSearchParams(location.search).get("as") || "ADMIN";
  const realFetch = window.fetch;
  window.fetch = (url, opts) => {
    if (url !== "/members/me") return realFetch(url, opts);
    if (AS === "GUEST") return Promise.resolve(new Response("", { status: 401 }));
    return Promise.resolve(Response.json({ memberId: 1, name: "미리보기", role: AS }));
  };
</script>
</head>
<body>
  <div class="pick">로그인한 사람:
    <a href="?as=ADMIN">관리자 (role = ADMIN)</a>
    <a href="?as=USER">회원 (role = USER)</a>
    <a href="?as=GUEST">로그인 안 함</a>
  </div>
  <section>
    <header data-hotel-header></header>
    <div class="body">← 여기에 각 화면 본문</div>
  </section>
  <script>
    for (const a of document.querySelectorAll(".pick a")) a.classList.toggle("on", a.search === `?as=${AS}`);
  </script>
  <script src="layout.js"></script>
</body>
</html>
