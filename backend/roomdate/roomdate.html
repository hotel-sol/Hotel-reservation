<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예약 일자 관리</title>
<!-- ADM-002 관리자) 예약 일자 관리. 상단 메뉴는 공통 frontend/layout/layout.js (관리자만 들어옴). -->
<style>
  body { margin: 0; font-family: system-ui, "Malgun Gothic", sans-serif; color: #1f2937; background: #fff; }
  main { display: grid; grid-template-columns: 1fr 260px; gap: 24px; padding: 24px 28px; max-width: 980px; }
  .no { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
        background: #c2410c; color: #fff; font-size: 12px; font-weight: 700; margin-right: 8px; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  select, input { font: inherit; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; }
  select { min-width: 220px; }
  .month { font-size: 18px; font-weight: 700; }
  .month button { border: 0; background: none; font-size: 18px; cursor: pointer; padding: 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; font-size: 13px; color: #6b7280; padding: 4px 0; }
  .day { height: 68px; border: 1px solid #e5e7eb; border-radius: 4px; background: #fff; text-align: left;
         padding: 6px 8px; font: inherit; font-size: 13px; display: flex; flex-direction: column;
         justify-content: space-between; cursor: pointer; }
  .day small { font-size: 11px; color: #4b5563; }
  .day.closed { background: #fdf2f2; }
  .day.closed small { color: #dc2626; font-weight: 700; }
  .day.selected { border: 2px solid #111827; }
  .day:disabled { color: #c0c4cc; cursor: not-allowed; background: #fafafa; }
  .legend { font-size: 12px; color: #4b5563; margin-top: 10px; display: flex; gap: 16px; }
  .sw { display: inline-block; width: 12px; height: 12px; border: 1px solid #d1d5db; vertical-align: -2px; margin-right: 4px; }
  .panel { border: 1px solid #d1d5db; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 16px; margin: 0 0 6px; }
  .panel p { margin: 4px 0; font-size: 13px; color: #4b5563; }
  .panel label { display: block; font-size: 12px; color: #6b7280; margin: 12px 0 4px; }
  .panel input { width: 100%; box-sizing: border-box; }
  .btn { width: 100%; padding: 11px; margin-top: 10px; border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
  .btn.primary { background: #1f2937; color: #fff; border: 0; }
  .btn.ghost { background: #fff; color: #1f2937; border: 1px solid #d1d5db; font-weight: 400; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .msg { min-height: 1em; font-size: 13px; color: #dc2626; margin-top: 8px; }
  .list { list-style: none; padding: 0; margin: 8px 0 0; font-size: 13px; }
  .list li { display: flex; justify-content: space-between; padding: 4px 0; }
  .list button { border: 0; background: none; color: #dc2626; cursor: pointer; font: inherit; }
  .empty { color: #9ca3af; }
  .hidden { display: none; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; padding: 16px; } }
</style>
</head>
<body>
<header data-hotel-header="admin"></header>
<main>
  <section>
    <div class="toolbar">
      <div><span class="no">1</span><b>객실</b>&nbsp;
        <select id="room"><option value="">전체 객실</option></select></div>
      <div class="month">
        <button id="prev" aria-label="이전 달">‹</button><span id="title"></span><button id="next" aria-label="다음 달">›</button>
      </div>
    </div>
    <div><span class="no">2</span></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><span class="sw" style="background:#fdf2f2"></span>휴무일</span>
      <span><span class="sw" style="border:2px solid #111827"></span>선택한 날짜</span>
      <span>"예약 N" = 그날 잡힌 예약 수</span>
    </div>
  </section>

  <aside>
    <div class="panel hidden" id="detail">
      <span class="no">3</span>
      <h2 id="d-title"></h2>
      <p id="d-count"></p>
      <label for="reason">휴무 사유</label>
      <input id="reason" maxlength="200" placeholder="예: 연말 시설 점검">
      <button class="btn primary" id="close">휴무일로 지정</button>
      <button class="btn ghost" id="open">휴무 해제</button>
      <div class="msg" id="msg" role="alert"></div>
    </div>
    <div class="panel">
      <span class="no">4</span><b>이번 달 휴무일</b>
      <ul class="list" id="list"></ul>
    </div>
  </aside>
</main>

<script>
// 로그인은 회원 기능의 세션 쿠키로 확인한다(같은 사이트라 fetch가 자동으로 보냄).
const API = "/api/admin/closed-dates";
const DOW = ["일", "월", "화", "수", "목", "금", "토"];

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const now = new Date();
const today = iso(now.getFullYear(), now.getMonth() + 1, now.getDate());

let year = now.getFullYear(), month = now.getMonth() + 1;
let selected = null;   // "YYYY-MM-DD"
let data = { closedDates: [], reservationCounts: {}, rooms: [] };

async function call(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.ok) return res.status === 204 ? null : res.json();
  if (res.status === 401) {   // 로그인이 풀렸으면 로그인 화면으로, 로그인 뒤 이 화면으로 돌아옴
    location.href = `/login?next=${encodeURIComponent(location.pathname)}`;
  }
  const err = await res.json().catch(() => ({}));
  throw new Error(err.detail?.message || "요청을 처리하지 못했습니다.");
}

async function load() {
  const roomId = $("room").value;
  try {
    data = await call("GET", `${API}?month=${year}-${pad(month)}${roomId ? `&roomId=${roomId}` : ""}`);
  } catch (e) {
    $("list").innerHTML = "";
    $("list").append(Object.assign(document.createElement("li"), { textContent: e.message, className: "empty" }));
    return;
  }
  fillRooms();
  render();
}

function fillRooms() {
  const sel = $("room");
  if (sel.options.length > 1) return;
  for (const r of data.rooms) sel.append(new Option(r.roomName, r.roomId));
}

// 전체 객실 보기: 호텔 전체 휴무만 달력에 표시(방 휴무는 ④ 목록에만). 방 보기: 호텔 전체 + 그 방 휴무.
const closedOn = (day) => data.closedDates.find((c) => c.closedDate === day && (data.roomId != null || c.roomId == null));
const label = (c) => `${c.closedDate.slice(5).replace("-", "/")} ${c.roomId ? c.roomName : "전체"} · ${c.reason}`;

function render() {
  $("title").textContent = `${year}년 ${month}월`;
  const grid = $("grid");
  grid.innerHTML = "";
  for (const d of DOW) grid.append(Object.assign(document.createElement("div"), { className: "dow", textContent: d }));
  const blanks = new Date(year, month - 1, 1).getDay();
  for (let i = 0; i < blanks; i++) grid.append(document.createElement("div"));

  const last = new Date(year, month, 0).getDate();
  for (let d = 1; d <= last; d++) {
    const day = iso(year, month, d);
    const btn = document.createElement("button");
    const n = data.reservationCounts[day];
    const closed = closedOn(day);
    btn.className = "day" + (closed ? " closed" : "") + (day === selected ? " selected" : "");
    btn.disabled = day < today;
    btn.append(document.createTextNode(d));
    const tag = document.createElement("small");
    tag.textContent = closed ? "휴무" : n ? `예약 ${n}` : "";
    btn.append(tag);
    btn.onclick = () => { selected = day; $("reason").value = ""; render(); };
    grid.append(btn);
  }

  const list = $("list");
  list.innerHTML = "";
  if (!data.closedDates.length) list.append(Object.assign(document.createElement("li"), { className: "empty", textContent: "휴무일이 없습니다." }));
  for (const c of data.closedDates) {
    const li = document.createElement("li");
    li.append(document.createTextNode(label(c)));
    const b = Object.assign(document.createElement("button"), { textContent: "해제" });
    b.onclick = () => release(c);
    li.append(b);
    list.append(li);
  }
  renderDetail();
}

function renderDetail() {
  const panel = $("detail");
  const inMonth = selected && selected.startsWith(`${year}-${pad(month)}`);
  panel.classList.toggle("hidden", !inMonth);
  if (!inMonth) return;
  const [y, m, d] = selected.split("-").map(Number);
  $("d-title").textContent = `${m}월 ${d}일 (${DOW[new Date(y, m - 1, d).getDay()]})`;
  $("d-count").textContent = `이 날 예약 ${data.reservationCounts[selected] || 0}건`;
  const closed = closedOn(selected);
  $("reason").disabled = !!closed;
  if (closed) $("reason").value = closed.reason;
  $("close").disabled = !!closed;
  $("open").disabled = !closed;
  $("msg").textContent = "";
}

$("close").onclick = async () => {
  const reason = $("reason").value.trim();
  if (!reason) { $("msg").textContent = "휴무 사유를 입력해 주세요."; return; }
  const roomId = $("room").value;
  try {
    await call("POST", API, { closedDate: selected, roomId: roomId ? Number(roomId) : null, reason });
    await load();
  } catch (e) {
    $("msg").textContent = e.message;   // 예: "이 날짜에 예약 1건이 있습니다. 먼저 예약을 취소해 주세요."
  }
};

$("open").onclick = () => { const c = closedOn(selected); if (c) release(c); };

async function release(c) {
  if (!confirm(`${label(c)} 휴무를 해제할까요?`)) return;
  try {
    await call("DELETE", `${API}/${c.closedDateId}`);
    await load();
  } catch (e) {
    $("msg").textContent = e.message;
  }
}

$("room").onchange = () => { load(); };
$("prev").onclick = () => { month === 1 ? (year--, month = 12) : month--; load(); };
$("next").onclick = () => { month === 12 ? (year++, month = 1) : month++; load(); };
load();
</script>
<script src="/layout/layout.js"></script>
</body>
</html>
