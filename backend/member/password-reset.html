<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 찾기</title>
<style>
  body { margin: 0; font-family: system-ui, "Malgun Gothic", sans-serif; color: #1f2937; background: #fff; }
  main { max-width: 380px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .note { font-size: 13px; color: #6b7280; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: #4b5563; margin: 14px 0 6px; }
  input { width: 100%; box-sizing: border-box; font: inherit; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 6px; }
  button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 6px; background: #1f2937; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; }
  .msg { min-height: 1.2em; font-size: 13px; color: #dc2626; margin-top: 12px; }
  .alt { margin-top: 20px; font-size: 14px; text-align: center; }
  .alt a { color: #1f2937; font-weight: 700; }
</style>
</head>
<body>
<header data-hotel-header></header>
<main>
  <h1>비밀번호 찾기</h1>
  <p class="note">아이디와 가입할 때 적은 이메일이 맞으면 새 비밀번호로 바꿉니다. 이메일을 적지 않고 가입했다면 관리자에게 문의해 주세요.</p>
  <form id="form" novalidate>
    <label for="loginId">아이디</label>
    <input id="loginId" autocomplete="username">
    <label for="email">가입한 이메일</label>
    <input id="email" type="email" autocomplete="email">
    <label for="newPassword">새 비밀번호 (8자 이상)</label>
    <input id="newPassword" type="password" autocomplete="new-password" maxlength="100">
    <label for="newPassword2">새 비밀번호 확인</label>
    <input id="newPassword2" type="password" autocomplete="new-password" maxlength="100">
    <button id="submit">비밀번호 바꾸기</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <p class="alt"><a href="/login">로그인으로 돌아가기</a></p>
</main>
<script>
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!loginId.value.trim() || !email.value.trim()) { msg.textContent = "아이디와 이메일을 입력해 주세요."; return; }
    if (newPassword.value.length < 8) { msg.textContent = "새 비밀번호는 8자 이상입니다."; return; }
    if (newPassword.value !== newPassword2.value) { msg.textContent = "새 비밀번호 확인이 다릅니다."; return; }
    submit.disabled = true;
    try {
      const res = await fetch("/api/members/password-reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ loginId: loginId.value.trim(), email: email.value.trim(), newPassword: newPassword.value }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail?.message || "바꾸지 못했습니다.");
      }
      location.href = "/login?reset=1";
    } catch (err) {
      msg.textContent = err.message;
      submit.disabled = false;
    }
  };
</script>
<script src="/layout/layout.js"></script>
</body>
</html>
