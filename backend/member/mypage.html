<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 정보</title>
<style>
  body { margin: 0; font-family: system-ui, "Malgun Gothic", sans-serif; color: #1f2937; background: #fff; }
  main { max-width: 440px; margin: 40px auto; padding: 0 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .who { color: #6b7280; font-size: 14px; margin: 0 0 8px; }
  section { border: 1px solid #e5e7eb; border-radius: 8px; padding: 18px; margin-top: 18px; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  label { display: block; font-size: 13px; color: #4b5563; margin: 12px 0 6px; }
  label small { color: #9ca3af; }
  input { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; }
  button { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 6px; background: #1f2937; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button.danger { background: #fff; color: #dc2626; border: 1px solid #fca5a5; }
  button:disabled { opacity: .5; }
  .msg { min-height: 1.2em; font-size: 13px; color: #dc2626; margin-top: 10px; }
  .msg.ok { color: #15803d; }
  .note { font-size: 13px; color: #6b7280; margin: 4px 0 0; }
</style>
</head>
<body>
<header data-hotel-header></header>
<main>
  <h1>내 정보</h1>
  <p class="who" id="who"></p>

  <section>
    <h2>정보 수정</h2>
    <form id="profileForm" novalidate>
      <label for="memberName">이름 *</label>
      <input id="memberName" autocomplete="name" maxlength="50">
      <label for="phone">전화번호 <small>(선택)</small></label>
      <input id="phone" type="tel" autocomplete="tel" maxlength="20" placeholder="010-0000-0000">
      <label for="email">이메일 <small>(선택, 비밀번호 찾기에 필요)</small></label>
      <input id="email" type="email" autocomplete="email" maxlength="100">
      <button>저장</button>
      <div class="msg" id="profileMsg" role="status"></div>
    </form>
  </section>

  <section>
    <h2>비밀번호 변경</h2>
    <p class="note">바꾸면 다른 기기의 로그인은 끊깁니다.</p>
    <form id="passwordForm" novalidate>
      <label for="currentPassword">현재 비밀번호</label>
      <input id="currentPassword" type="password" autocomplete="current-password">
      <label for="newPassword">새 비밀번호 (8자 이상)</label>
      <input id="newPassword" type="password" autocomplete="new-password" maxlength="100">
      <label for="newPassword2">새 비밀번호 확인</label>
      <input id="newPassword2" type="password" autocomplete="new-password" maxlength="100">
      <button>비밀번호 변경</button>
      <div class="msg" id="passwordMsg" role="status"></div>
    </form>
  </section>

  <section id="withdrawSection">
    <h2>회원 탈퇴</h2>
    <p class="note">이름 · 전화번호 · 이메일이 지워지고 다시 로그인할 수 없습니다. 지난 예약 기록은 "탈퇴회원"으로 남습니다. 진행 중인 예약이 있으면 먼저 취소해 주세요.</p>
    <form id="withdrawForm" novalidate>
      <label for="withdrawPassword">비밀번호 확인</label>
      <input id="withdrawPassword" type="password" autocomplete="current-password">
      <button class="danger">탈퇴하기</button>
      <div class="msg" id="withdrawMsg" role="status"></div>
    </form>
  </section>
</main>
<script>
  async function call(method, url, body) {
    const res = await fetch("/api" + url, {
      method,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401) { location.href = "/login?next=/mypage"; throw new Error("로그인이 필요합니다."); }
    const data = res.status === 204 ? null : await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data?.detail?.message || (res.status === 422 ? "입력값을 확인해 주세요." : "처리하지 못했습니다."));
    return data;
  }

  function show(el, text, ok) { el.textContent = text; el.className = ok ? "msg ok" : "msg"; }

  function fill(me) {
    who.textContent = `${me.loginId} · ${me.role === "ADMIN" ? "관리자" : "회원"}`;
    memberName.value = me.name;
    phone.value = me.phone || "";
    email.value = me.email || "";
    withdrawSection.hidden = me.role === "ADMIN";   // 관리자는 탈퇴 불가(서버도 막음)
  }

  profileForm.onsubmit = async (e) => {
    e.preventDefault();
    if (!memberName.value.trim()) return show(profileMsg, "이름을 입력해 주세요.");
    try {
      fill(await call("PUT", "/members/me", {
        name: memberName.value.trim(), phone: phone.value.trim() || null, email: email.value.trim() || null,
      }));
      show(profileMsg, "저장했습니다.", true);
    } catch (err) { show(profileMsg, err.message); }
  };

  passwordForm.onsubmit = async (e) => {
    e.preventDefault();
    if (newPassword.value.length < 8) return show(passwordMsg, "새 비밀번호는 8자 이상입니다.");
    if (newPassword.value !== newPassword2.value) return show(passwordMsg, "새 비밀번호 확인이 다릅니다.");
    try {
      await call("PUT", "/members/me/password", { currentPassword: currentPassword.value, newPassword: newPassword.value });
      passwordForm.reset();
      show(passwordMsg, "비밀번호를 바꿨습니다.", true);
    } catch (err) { show(passwordMsg, err.message); }
  };

  withdrawForm.onsubmit = async (e) => {
    e.preventDefault();
    if (!withdrawPassword.value) return show(withdrawMsg, "비밀번호를 입력해 주세요.");
    if (!confirm("정말 탈퇴할까요? 되돌릴 수 없습니다.")) return;
    try {
      await call("POST", "/members/me/withdraw", { password: withdrawPassword.value });
      location.href = "/login";
    } catch (err) { show(withdrawMsg, err.message); }
  };

  call("GET", "/members/me").then(fill).catch(() => {});
</script>
<script src="/layout/layout.js"></script>
</body>
</html>
