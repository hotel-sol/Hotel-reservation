[project]
name = "hotel-backend"
version = "0.1.0"
description = "호텔 예약 시스템 백엔드 (FastAPI + MSSQL)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "pymssql>=2.3",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
